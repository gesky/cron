<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; script-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="robots" content="noindex">
  <title>Página não encontrada | Cron Web Studio</title>
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/img/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="stylesheet" href="/css/fonts.css">
  <style>
    :root { --lime: #c6ff02; --ink: #1a1a1a; --mist: #e6e6e6; }
    * { box-sizing: border-box; }
    ::selection { background: var(--lime); color: var(--ink); }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: "Sora", system-ui, sans-serif; background: var(--ink); color: var(--mist);
      display: grid; place-items: center; padding: 24px; text-align: center;
      -webkit-font-smoothing: antialiased;
    }
    .icon { width: 64px; height: 64px; margin: 0 auto 32px; display: block; }
    .code { font-size: .78rem; letter-spacing: .16em; text-transform: uppercase; color: var(--lime); margin: 0 0 14px; }
    h1 { font-size: clamp(2rem, 6vw, 3.2rem); font-weight: 600; letter-spacing: -.03em; line-height: 1.1; margin: 0 0 16px; color: #fff; }
    p { color: rgba(230, 230, 230, .65); max-width: 40ch; margin: 0 auto 36px; line-height: 1.6; }
    a.btn {
      display: inline-flex; align-items: center; gap: 10px; height: 52px; padding: 0 28px;
      border-radius: 999px; background: var(--lime); color: var(--ink); font-weight: 500; text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <img class="icon" src="/img/icon-192.png" alt="">
    <p class="code">Erro 404</p>
    <h1>Essa página não está no ar.</h1>
    <p>O endereço pode ter mudado ou não existe mais. O resto do site segue rodando normalmente.</p>
    <a class="btn" href="/">Voltar para o início →</a>
  </main>
</body>
</html>
